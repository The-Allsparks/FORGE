cadence_windows:
  - id: preseason
    start: "2026-08-19"
    end: "2026-09-11"
    intent: Shop onboarding (PS001 date TBC), Strafer StarterBot build (PS002–PS004), drivetrain corrections and TRACE habit (S001–S004), passive AMPER/MIMIC, intro ViDAR/BEACON/ECHO/HELM without authority.
  - id: kickoff-to-clinic
    start: "2026-09-12"
    end: "2026-10-10"
    intent: Minimum viable BIOBUZZ robot; TRACE on; AMPER/BEACON passive; ECHO sim or drills; HELM describe/simulate; conventional fallbacks.
  - id: reliability-sprint
    start: "2026-10-12"
    end: "2026-10-31"
    intent: Repairs, auto reps, driver practice; only tested MIMIC protections; ECHO off unless evidenced; HELM observe or static.
  - id: league-development
    start: "2026-11-02"
    end: "2026-12-05"
    intent: Match evidence; deeper calibration; still drive and auto every week. Use Meeting A/B templates when a numbered session is not written.
  - id: adversity-simulations
    start: "2026-12-07"
    end: "2027-01-09"
    intent: Full match simulations and failure drills; immediate rollback for optional systems.
  - id: feature-freeze
    start: "2027-01-11"
    end: "2027-01-23"
    intent: Freeze active features; mock competition; inspection; judging; pit.
  - id: state-prep
    start: "2027-01-25"
    end: "2027-02-20"
    intent: If advancing, two or three evidenced improvements only; prioritize driving, auto, reliability, judging.
