    start: "2026-12-07"
    end: "2027-01-09"
    intent: Full match simulations and failure drills; immediate rollback for optional systems.
  - id: feature-freeze
    start: "2027-01-11"
    end: "2027-01-23"
    intent: Freeze active features; mock competition; inspection; judging; pit.
  - id: state-prep
    start: "2027-01-25"
    end: "2027-02-20"
    intent: If advancing, two or three evidenced improvements only; prioritize driving, auto, reliability, judging.
