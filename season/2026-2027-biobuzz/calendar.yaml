cadence_windows:
  - id: preseason
    start: "2026-08-19"
    end: "2026-09-11"
    intent: Preseason P000–P003, S001–S002, P004–P005 — capable team, Strafer drivetrain, reusable mechanism experiments, ~30 min/week software cap; no speculative BIOBUZZ tower or hopper.
  - id: kickoff-to-clinic
    start: "2026-09-12"
    end: "2026-10-10"
    intent: Minimum viable BIOBUZZ robot; TRACE on; AMPER/BEACON passive; ECHO sim or drills; HELM describe/simulate; conventional fallbacks.
  - id: reliability-sprint
    start: "2026-10-12"
    end: "2026-10-31"
    intent: Repairs, auto reps, driver practice; only tested MIMIC protections; ECHO off unless evidenced; HELM observe or static.
